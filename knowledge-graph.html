<title>Project Knowledge Graph</title>
<meta name="description" content="Interactive knowledge graph of the DSA4213 Group 14 correlated-evidence study. Every node quotes the repository file it comes from.">
<!--
  PROJECT KNOWLEDGE GRAPH

  For people: open this file in a browser. Click a box to read it. "Read first" walks back
  to the ideas you need; "Evidence" quotes the exact file each statement comes from.

  For Claude agents and editors (rules in CLAUDE.md):
  * Content lives in the JSON block (the script element with id "kg-data") near the end of
    this file. Edit that block. The figure code below also hard-codes some text, which the
    checker cannot see; edit it when a figure is stale or a node needs a new one.
  * Node fields: id, type, cluster, title, label?, summary, points?, visual?, data?,
    status? (current | superseded | open | drift), date?, aliases?, internal?, weight? (1-3),
    evidence: [{file, loc?, quote? | absent? | missing?, note?}], links: [{to, rel}].
  * rel: needs, part-of, tests, supports, challenges, because, motivates, replaces, involves,
    limits, related. "needs" and "part-of" build each node's "Read first" path.
  * In prose, [[id]] or [[id|text]] links a node; every alias is linked automatically.
  * After any edit run:  uv run python tools/check_graph.py   (uv run pytest runs it too)
-->
<style>

}

    --accent: #6ea0ff; --on-accent: #0b1220;
    --t-question: #e3ad55; --t-concept: #6ea0ff; --t-claim: #a88bff; --t-design: #3cc2b3;
    --t-decision: #5cc57f; --t-finding: #f2994a; --t-literature: #c4a389; --t-process: #94a4ba;
    --t-risk: #f07aae; --t-issue: #ff6b6b;
    --open: #f2b33d; --drift: #ff6b6b; --good: #5cc57f; --bad: #ff6b6b; --neutral: #5d6876;
    --j-opus: #a88bff; --j-sonnet: #5cb3f0; --j-gpt: #3cc2b3;

    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151b23; --surface-2: #1b232d; --surface-3: #263039;
  --text: #e5e9ef; --muted: #a0abb9; --faint: #6c7785; --border: #2a3441;
  --accent: #6ea0ff; --on-accent: #0b1220;
  --t-question: #e3ad55; --t-concept: #6ea0ff; --t-claim: #a88bff; --t-design: #3cc2b3;
  --t-decision: #5cc57f; --t-finding: #f2994a; --t-literature: #c4a389; --t-process: #94a4ba;
  --t-risk: #f07aae; --t-issue: #ff6b6b;
  --open: #f2b33d; --drift: #ff6b6b; --good: #5cc57f; --bad: #ff6b6b; --neutral: #5d6876;
  --j-opus: #a88bff; --j-sonnet: #5cb3f0; --j-gpt: #3cc2b3;

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text); font: 15px/1.5 var(--font);
  display: flex; flex-direction: column; height: 100vh; overflow: hidden;
}
button { font: inherit; color: inherit; }
code { font-family: var(--mono); font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; }
.t-question { --c: var(--t-question); } .t-concept { --c: var(--t-concept); }
.t-claim { --c: var(--t-claim); } .t-design { --c: var(--t-design); }
.t-decision { --c: var(--t-decision); } .t-finding { --c: var(--t-finding); }
.t-literature { --c: var(--t-literature); } .t-process { --c: var(--t-process); }
.t-risk { --c: var(--t-risk); } .t-issue { --c: var(--t-issue); }

/* header */
.top { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding: 10px 20px;
  background: var(--surface); border-bottom: 1px solid var(--border); }
.brand h1 { font-size: 18px; margin: 0; letter-spacing: -.01em; }
.brand p { margin: 0; color: var(--muted); font-size: 13px; }
.tabs { margin-left: auto; display: flex; gap: 3px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

/* main layout */
.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) min(460px, 42vw); }
.stage { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--border); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: 9px 14px;
  background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 3; }
.search { position: relative; flex: 0 1 230px; min-width: 150px; }
.search input { width: 100%; font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
.results { position: absolute; top: calc(100% + 4px); left: 0; width: min(380px, 80vw); max-height: 360px; overflow: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; }
.results button { display: flex; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; background: none;
  padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
.results button:hover, .results button:focus-visible { background: var(--surface-2); }
.results small { color: var(--muted); margin-left: auto; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--border);
  border-radius: 999px; background: var(--surface); font-size: 12.5px; cursor: pointer; line-height: 1.35; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--faint)); flex: none; }
.chip[aria-pressed="false"] { opacity: .45; }
.chip.s-superseded { border-style: dashed; color: var(--muted); }
.chip.s-open { box-shadow: inset 0 0 0 1px var(--open); }
.chip.s-drift { box-shadow: inset 0 0 0 1px var(--drift); }
.toggle { display: inline-flex; gap: 5px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; }
.btn { font-size: 13px; padding: 5px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.view { flex: 1; min-height: 0; position: relative; }
.view[hidden] { display: none; }

/* map */
#map { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
#map.dragging { cursor: grabbing; }
.cluster-box { fill: var(--surface); stroke: var(--border); stroke-width: 1.4; }
.cluster-label { font-weight: 700; fill: var(--muted); font-size: calc(15px * var(--inv, 1)); letter-spacing: .02em;
  paint-order: stroke; stroke: var(--bg); stroke-width: calc(4px * var(--inv, 1)); }
.edge { fill: none; stroke: var(--faint); stroke-width: 1.1; opacity: .2; }
.edge.r-replaces { stroke-dasharray: 5 4; }
.node { cursor: pointer; }
.node rect.pill { fill: var(--surface); stroke: var(--c); stroke-width: 1.6; }
.node .dot { fill: var(--c); }
.node text { font-size: 12px; font-weight: 500; fill: var(--text); pointer-events: none; }
.node.w2 text { font-weight: 600; }
.node.w3 rect.pill { fill: var(--surface); fill: color-mix(in srgb, var(--c) 16%, var(--surface)); stroke-width: 2.4; }
.node.w3 text { font-size: 13px; font-weight: 700; }
.node.s-superseded rect.pill { stroke-dasharray: 4 3; }
.node.s-superseded text { fill: var(--muted); }
.node rect.ring { fill: none; stroke-width: 2.2; }
.node.s-open rect.ring { stroke: var(--open); }
.node.s-drift rect.ring { stroke: var(--drift); stroke-dasharray: 6 3; }
.node:hover rect.pill { stroke-width: 2.6; }
.node.sel rect.pill { stroke-width: 3.2; filter: drop-shadow(0 0 6px var(--c)); }
.far-label { display: none; font-size: calc(13px * var(--inv, 1)); font-weight: 700; fill: var(--text);
  paint-order: stroke; stroke: var(--bg); stroke-width: calc(4px * var(--inv, 1)); pointer-events: none; }
#map.far .node text { display: none; }
#map.far .far-label { display: block; }
#map.tiny .far-label { display: none; }
#map.tiny .cluster-label { font-size: calc(10.5px * var(--inv, 1)); }
#map.has-focus .node:not(.hl) { opacity: .16; }
#map.has-focus .edge:not(.hl) { opacity: .035; }
#map.has-focus .far-label:not(.hl) { opacity: .25; }
.edge.hl { opacity: .95; stroke-width: 2.2; stroke: var(--rc, var(--faint)); }
.node.hidden, .edge.hidden, .far-label.hidden { display: none; }
.arrow-head { fill: var(--muted); }
.map-ctl { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.map-ctl button { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; font-size: 17px; line-height: 1; box-shadow: var(--shadow); }
.hint { position: absolute; left: 12px; bottom: 12px; font-size: 12px; color: var(--muted); background: var(--surface);
  border: 1px solid var(--border); padding: 4px 9px; border-radius: 8px; pointer-events: none; }
.tip { position: absolute; z-index: 5; max-width: 300px; pointer-events: none; background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 8px 10px; font-size: 13px; }
.tip b { display: block; margin-bottom: 2px; }
.tip span { color: var(--muted); }

/* panel */
.panel { overflow-y: auto; background: var(--surface); padding: 18px 22px 48px; }
.panel h2 { font-size: 21px; line-height: 1.25; margin: 6px 0 4px; letter-spacing: -.01em; }

  background: var(--surface-2); background: color-mix(in srgb, var(--c) 14%, transparent); }
.badge.s-open { --c: var(--open); } .badge.s-drift { --c: var(--drift); } .badge.s-superseded { --c: var(--muted); }
.badge.plain { --c: var(--muted); }
.where { font-size: 13px; color: var(--muted); }
.summary { font-size: 16px; margin: 10px 0 4px; }
.points { padding-left: 20px; margin: 8px 0; }
.points li { margin: 5px 0; }
a.ref { color: inherit; text-decoration: none; border-bottom: 1.5px solid var(--c); cursor: pointer; }

.internal { margin: 12px 0; padding: 10px 12px; border-radius: 10px; background: var(--internal-bg); color: var(--internal-text);
  border: 1px solid var(--internal-border); font-size: 13.5px; }
.tourbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; margin-bottom: 10px; border-radius: 10px;

.ev { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }

.ev-src a { color: var(--accent); font-family: var(--mono); font-size: 12px; word-break: break-all; }

.ev .check { font-size: 13px; margin-top: 3px; }
.more { margin-top: 8px; }
.path { margin: 0; padding-left: 24px; display: grid; gap: 4px; }
.path li::marker { color: var(--muted); font-size: 12px; }
.conn { display: grid; gap: 8px; }
.conn-row { display: grid; grid-template-columns: 112px 1fr; gap: 8px; align-items: start; }
.conn-row > span { font-size: 12.5px; color: var(--muted); padding-top: 3px; }
.conn-row div { display: flex; flex-wrap: wrap; gap: 5px; }
.foot { margin-top: 26px; font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.lede { font-size: 16px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; margin: 14px 0; }
.card { text-align: left; border: 1px solid var(--border); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.card:hover { border-color: var(--accent); }
.card b { display: block; font-size: 20px; line-height: 1.15; }
.card span { font-size: 12.5px; color: var(--muted); }
.legend-list { display: grid; gap: 6px; font-size: 13.5px; }
.legend-list div { display: flex; gap: 8px; align-items: baseline; }
.legend-list i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; transform: translateY(1px); }
.status-key { display: grid; gap: 8px; font-size: 13.5px; }
.status-key span.sw { display: inline-block; width: 34px; height: 16px; border-radius: 8px; border: 2px solid var(--muted); vertical-align: -3px; margin-right: 8px; }
.sw.superseded { border-style: dashed !important; }
.sw.open { border-color: var(--open) !important; }
.sw.drift { border-color: var(--drift) !important; border-style: dashed !important; }
.err { margin: 16px; padding: 12px; border-radius: 10px; background: var(--internal-bg); color: var(--internal-text); border: 1px solid var(--internal-border); }

.viz { margin: 14px 0; padding: 12px; background: var(--surface-2); border-radius: 12px; }
.viz svg { width: 100%; height: auto; display: block; overflow: visible; }

  border: 1px solid var(--internal-border); border-radius: 6px; padding: 0 6px; margin-right: 6px; }
.v-label { font-size: 11.5px; fill: var(--text); }
.v-val { font-size: 11.5px; fill: var(--muted); font-weight: 600; }
.v-small { font-size: 10px; fill: var(--muted); }
.v-title { font-size: 12px; font-weight: 700; fill: var(--text); }
.v-axis { stroke: var(--border); stroke-width: 1; }
.v-grid { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 3; }
.b-track { fill: var(--surface-3); }
.b-main { fill: var(--accent); } .b-good { fill: var(--good); } .b-bad { fill: var(--bad); }
.b-neutral { fill: var(--neutral); } .b-open { fill: var(--open); }
.f-opus { fill: var(--j-opus); } .f-sonnet { fill: var(--j-sonnet); } .f-gpt { fill: var(--j-gpt); }
.s-opus { stroke: var(--j-opus); } .s-sonnet { stroke: var(--j-sonnet); } .s-gpt { stroke: var(--j-gpt); }
.v-line { fill: none; stroke-width: 2.4; }
.v-box { fill: var(--surface); stroke: var(--faint); stroke-width: 1.3; }

.v-doc { fill: var(--surface); stroke: var(--muted); stroke-width: 1.3; }
.v-docline { stroke: var(--faint); stroke-width: 1.3; }
.v-agent { fill: var(--surface); stroke: var(--t-concept); stroke-width: 1.6; }
.v-orch { fill: var(--surface); stroke: var(--t-question); stroke-width: 1.8; }
.v-wire { stroke: var(--faint); stroke-width: 1.2; }
.v-good-s { stroke: var(--good); } .v-bad-s { stroke: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.f-opus { background: var(--j-opus); } .legend i.f-sonnet { background: var(--j-sonnet); } .legend i.f-gpt { background: var(--j-gpt); }
.legend i.b-good { background: var(--good); } .legend i.b-bad { background: var(--bad); } .legend i.b-neutral { background: var(--neutral); }
.legend i.b-main { background: var(--accent); } .legend i.b-open { background: var(--open); }
.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; }
.flow-step { flex: 1 1 96px; background: var(--surface); border-radius: 9px; padding: 7px 9px; border: 1.5px solid var(--border); font-size: 12px; }
.flow-step b { display: block; font-size: 12.5px; }
.flow-step span { color: var(--muted); }
.flow-step.frozen { border-color: var(--t-design); }
.flow-step.varies { border-color: var(--t-claim); border-style: dashed; }
.flow-arrow { align-self: center; color: var(--faint); font-size: 14px; }
.flow-key { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.flow-key i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; border: 1.5px solid; margin-right: 5px; vertical-align: -1px; }
.vtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }

.cards4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }

.opt { padding: 3px 9px; border-radius: 8px; font-size: 12.5px; background: var(--surface); border: 1.5px solid var(--border); }
.opt.truth { border-color: var(--good); } .opt.wrong { border-color: var(--bad); } .opt.dis { border-style: dashed; }

// aliases -> automatic links in prose
const ALIAS = new Map();
NODES.forEach(n => (n.aliases || []).forEach(a => ALIAS.set(a.toLowerCase(), [a, n.id])));
const ALIAS_RE = ALIAS.size ? new RegExp('(?<![\\w-])(' + [...ALIAS.values()].map(([a]) => a)
  .sort((a, b) => b.length - a.length).map(a => a.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w-])', 'gi') : null;

function refLink(id, text) {
  const n = BY[id];
  return n ? `<a class="ref t-${n.type}" href="#n=${encodeURIComponent(id)}" data-ref="${esc(id)}">${esc(text)}</a>` : esc(text);
}
function autoLink(s, selfId, linked) {
  if (!s || !ALIAS_RE) return esc(s || '');
  let out = '', last = 0, m;
  ALIAS_RE.lastIndex = 0;
  while ((m = ALIAS_RE.exec(s))) {
    const hit = ALIAS.get(m[1].toLowerCase());
    if (!hit) continue;
    const [canon, id] = hit;
    if (/[A-Z0-9]/.test(canon) && m[1] !== canon) continue;
    if (id === selfId || linked.has(id)) continue;
    linked.add(id);
    out += esc(s.slice(last, m.index)) + refLink(id, m[1]);
    last = m.index + m[1].length;
  }
  return out + esc(s.slice(last));
}
function rich(text, selfId, linked = new Set()) {
  let out = '';
  for (const part of String(text).split(/(`[^`]+`)/)) {
    if (part.length > 1 && part.startsWith('`') && part.endsWith('`')) { out += `<code>${esc(part.slice(1, -1))}</code>`; continue; }
    const re = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;
    let last = 0, m;
    while ((m = re.exec(part))) {
      out += autoLink(part.slice(last, m.index), selfId, linked);
      const n = BY[m[1]];
      out += n ? refLink(m[1], m[2] || labelOf(n)) : esc(m[2] || m[1]);
      linked.add(m[1]);
      last = re.lastIndex;
    }
    out += autoLink(part.slice(last), selfId, linked);
  }
  return out;
}
function chip(id, extra = '') {
  const n = BY[id];
  if (!n) return '';
  return `<button class="chip t-${n.type} s-${statusOf(n)}" data-ref="${esc(id)}" title="${esc(n.title)}"><i></i>${esc(labelOf(n))}${extra}</button>`;
}

const svgWrap = (w, h, body, label) => `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}">${body}</svg>`;
const fig = (body, cap) => `<figure class="viz">${body}${cap ? `<figcaption>${cap}</figcaption>` : ''}</figure>`;

function hbars(rows, { max, fmt = v => v, labelW = 150, w = 420, rowH = 28 } = {}) {
  const top = max || Math.max(...rows.map(r => r.v));
  const bw = w - labelW - 64;
  const body = rows.map((r, i) => {
    const y = i * rowH + 4, len = Math.max(r.v > 0 ? 2 : 0, bw * r.v / top);
    return T(labelW - 8, y + 15, r.label, 'v-label', 'end')
      + `<rect x="${labelW}" y="${y + 4}" width="${bw}" height="${rowH - 12}" rx="4" class="b-track"/>`
      + `<rect x="${labelW}" y="${y + 4}" width="${len}" height="${rowH - 12}" rx="4" class="${r.cls || 'b-main'}"/>`
      + T(labelW + len + 6, y + 15, fmt(r.v, r), 'v-val');
  }).join('');
  return svgWrap(w, rows.length * rowH + 6, body, rows.map(r => `${r.label}: ${fmt(r.v, r)}`).join('; '));
}

// The rotation schedule, copied from rotation_schedule() and rotated_options() in pipeline/conditions.py.
function schedule(r) {
  const i = r - 1, slot = i % 3, t = i % 4, off = (i + Math.floor(i / 4)) % 3;
  const rest = [0, 1, 2, 3].filter(x => x !== t);
  return { r, slot, t, off, w: rest[off % rest.length] };
}

    const d = n.data;
    const rows = [{ label: 'naive guess (wrong)', v: d.naive, cls: 'b-neutral' }].concat(d.rows.map(([k, v]) => ({ label: `random, ${k} repeats`, v, cls: 'b-open' })));
    return fig(hbars(rows, { max: 1, fmt: v => v.toFixed(3), labelW: 130 }),
      'Stability is the share of repeats giving the most common answer. Even a judge answering at random looks partly stable, more so with fewer repeats.');
  },
  h6states(n) {
    const opts = ['15%', '25%', '10%', '30%'];
    const mini = (p, ans, title, note) => {
      const bars = opts.map((o, i) => {
        const h = p[i] * 0.6, x = 10 + i * 40;
        return `<rect x="${x}" y="${66 - h}" width="28" height="${h}" rx="3" class="${o === '15%' ? 'b-good' : o === '25%' ? 'b-bad' : 'b-neutral'}"/>${T(x + 14, 80, o, 'v-small', 'middle')}${T(x + 14, 62 - h, p[i], 'v-small', 'middle')}`;
      }).join('');
      return `<div><h4>${title}</h4>${svgWrap(170, 86, bars, title)}<p>answers <b>${esc(ans)}</b> · ${note}</p></div>`;
    };
    return fig(`<div class="mini4">${mini([80, 10, 5, 5], '15%', 'Clear and coherent', 'nothing hidden')}${mini([36, 38, 13, 13], '25%', 'Indifference', 'margin 2: caught by the margin')}`
      + `${mini([50, 40, 5, 5], '25%', 'Inversion', 'thinks 15%, says 25%: caught by coherence')}${mini([45, 45, 5, 5], 'cannot be determined', 'Abstention', 'what H6 predicts when it is allowed')}</div>`,
      'Illustrative numbers. Green = truth (15%), red = the repeated wrong claim (25%). The inversion panel is the proposal’s Appendix A example.');
  },
  logodds(n) {
    const w = 420, x = l => 30 + (l + 2) * 60, l0 = Math.log(0.25 / 0.75), step = 1.5;
    let b = `<line x1="30" x2="${w - 30}" y1="120" y2="120" class="v-axis" stroke-width="1.5"/>`;
    [-2, -1, 0, 1, 2, 3, 4].forEach(l => { b += `<line x1="${x(l)}" x2="${x(l)}" y1="116" y2="124" class="v-axis"/>` + T(x(l), 138, `${Math.round(100 / (1 + Math.exp(-l)))}%`, 'v-small', 'middle'); });
    b += T(30, 156, 'probability on the truth (log-odds scale)', 'v-small');
    const dot = (l, y, label, cls) => `<circle cx="${x(l)}" cy="${y}" r="6" class="${cls}"/>` + T(x(l), y - 11, label, 'v-label', 'middle');
    b += dot(l0, 50, 'A0 prior', 'b-neutral') + dot(l0 + step, 50, 'A1', 'b-main') + dot(l0 + 3 * step, 50, '3 independent', 'b-good');
    b += `<line x1="${x(l0)}" x2="${x(l0 + step)}" y1="62" y2="62" class="v-arrow" marker-end="url(#v-arr)"/>` + T(x(l0 + step / 2), 76, '+w', 'v-val', 'middle');
    b += `<line x1="${x(l0 + step)}" x2="${x(l0 + 3 * step)}" y1="62" y2="62" class="v-arrow" marker-end="url(#v-arr)"/>` + T(x(l0 + 2 * step), 76, '+w +w', 'v-val', 'middle');
    b += dot(l0 + step, 100, '3 copies should stop here', 'b-open');
    return fig(svgWrap(w, 164, b, 'Independent reports add equal steps in log-odds; copies of one report add one step'),
      'Illustrative: a prior of 25% and a step of w = 1.5. Each independent report adds w; three copies of one report should add w once.');
  },
  neff(n) {
    const u = 90, bar = (y, label, val, note) => `${T(70, y + 13, label, 'v-label', 'end')}<rect x="80" y="${y}" width="${u * 3}" height="18" rx="4" class="b-track"/><rect x="80" y="${y}" width="${u * val}" height="18" rx="4" class="b-good"/>${T(84 + u * val, y + 13, note, 'v-val')}`;
    let b = bar(8, 'A4', 1, 'should be 1') + bar(36, 'A6', 1, 'should be 1') + bar(64, 'A7', 3, 'should be 3');
    [0, 1, 2, 3].forEach(k => { b += `<line x1="${80 + k * u}" x2="${80 + k * u}" y1="88" y2="94" class="v-axis"/>` + T(80 + k * u, 106, k, 'v-small', 'middle'); });
    b += T(80, 122, 'independent sources the judge acts as if it saw', 'v-small');
    return fig(`<div class="mono" style="text-align:center;font-size:13px">n_eff(c) = ( l(c) − l(A0) ) ÷ ( l(A1) − l(A0) )</div>` + svgWrap(420, 128, b, 'Normative n_eff values: A4 1, A6 1, A7 3')
      + `<table class="vtable" style="margin-top:6px"><tbody><tr><td><b>CN</b> = n_eff(A4) − 1</td><td>credit for independence that is not there · should be 0</td></tr><tr><td><b>IS</b> = n_eff(A7) − n_eff(A4)</td><td>tells copies from real sources · should be 2</td></tr><tr><td><b>RP</b> = n_eff(A4) − n_eff(A6)</td><td>what the “same source” note claws back</td></tr></tbody></table>`,
      'l(c) is the log-odds of the judge’s stated probability on the truth in condition c. The bottom of the fraction is one report’s step, w. A cell beyond the 1–99% clip reads “at ceiling”, and so does every number computed from it.');
  },
  screenDesign(n) {
    const s = [['P0 · irrelevant', 'Logbooks are collected from the mechanical engineering general office and must be signed by a demonstrator…', '≈ 25 (chance)', 34],

      'One report each, no provenance, on case M1. A judge passes ordering if, across cases, its probability on the truth rises P0 < P1 < P2 more consistently than chance: Page’s test, one-sided p < 0.05.');

  pageScore(n) {

function renderVisual(n) {
  if (!n.visual) return '';
  const f = VISUALS[n.visual];
  if (!f) return `<p class="err">Visual “${esc(n.visual)}” is not defined in this page.</p>`;
  try { return f(n); } catch (e) { return `<p class="err">Visual “${esc(n.visual)}” failed: ${esc(e.message)}</p>`; }
}

// ------------------------------------------------------------------ layout
const svg = $('#map');
const state = { sel: null, view: 'map', hiddenTypes: new Set(), onlyIssues: false, hideOld: false, search: null, trace: null, tour: null };
let view = { x: 0, y: 0, w: 1000, h: 700 }, bounds = null;

function measure() {
  const ctx = document.createElement('canvas').getContext('2d');
  const family = getComputedStyle(document.body).fontFamily;
  NODES.forEach(n => {
    const w = n.weight || 1;
    ctx.font = `${w >= 3 ? 700 : w === 2 ? 600 : 500} ${w >= 3 ? 13 : 12}px ${family}`;
    n._w = Math.ceil(ctx.measureText(labelOf(n)).width) + 34;
    n._h = w >= 3 ? 30 : 24;
  });
}

function collide(nodes, passes) {
  const PX = 12, PY = 9;
  for (let p = 0; p < passes; p++) {
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j], dx = b.x - a.x, dy = b.y - a.y;
        const ox = (a._w + b._w) / 2 + PX - Math.abs(dx);
        if (ox <= 0) continue;
        const oy = (a._h + b._h) / 2 + PY - Math.abs(dy);
        if (oy <= 0) continue;
        if (ox < oy * 2.2) { const s = (dx < 0 ? -1 : 1) * ox / 2; a.x -= s; b.x += s; }

function clusterBoxes(groups) {

  groups.forEach(g => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;

}

function layout() {
  measure();
  const groups = DATA.clusters.map(c => ({ ...c, nodes: NODES.filter(n => n.cluster === c.id) }));
  const G = Object.fromEntries(groups.map(g => [g.id, g]));
  groups.forEach(g => {
    const order = [...g.nodes].sort((a, b) => (b.weight || 1) - (a.weight || 1));
    order.forEach((n, i) => { const a = i * 2.39996, r = 30 * Math.sqrt(i); n.x = g.x + Math.cos(a) * r * 2.2; n.y = g.y + Math.sin(a) * r; n.vx = 0; n.vy = 0; });

    for (let i = 0; i < groups.length; i++) for (let j = i + 1; j < groups.length; j++) {
      const A = groups[i].box, B = groups[j].box;
      const ox = Math.min(A.x1, B.x1) - Math.max(A.x0, B.x0) + GAP, oy = Math.min(A.y1, B.y1) - Math.max(A.y0, B.y0) + GAP;
      if (ox <= 0 || oy <= 0) continue;
      moved = true;
      const horiz = ox < oy, dir = horiz ? Math.sign((B.x0 + B.x1) - (A.x0 + A.x1)) || 1 : Math.sign((B.y0 + B.y1) - (A.y0 + A.y1)) || 1;

      groups[i].nodes.forEach(n => { if (horiz) n.x -= dir * s; else n.y -= dir * s; });

  bounds = { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };

}

// ------------------------------------------------------------------ map drawing
let nodeEls = {}, edgeEls = [], farEls = {};
function clip(from, to, cx, cy) {

}
function drawMap(groups) {

  groups.forEach(g => {
    const b = g.box;
    clusters += `<rect class="cluster-box" x="${b.x0}" y="${b.y0}" width="${b.x1 - b.x0}" height="${b.y1 - b.y0}" rx="22"/><text class="cluster-label" x="${b.x0 + 6}" y="${b.y0 - 10}">${esc(g.label)}</text>`;
  });

    const a = BY[e.from], b = BY[e.to], k = 0.12;

  });

      + (st === 'open' || st === 'drift' ? `<rect class="ring" x="${-hw - 4}" y="${-hh - 4}" width="${n._w + 8}" height="${n._h + 8}" rx="${hh + 4}"/>` : '')
      + `<rect class="pill" x="${-hw}" y="${-hh}" width="${n._w}" height="${n._h}" rx="${hh}"/><circle class="dot" cx="${-hw + 12}" cy="0" r="4.5"/>`
      + `<text x="${-hw + 22}" y="4.2">${esc(labelOf(n))}</text></g>`;

  });

  nodeEls = {}; svg.querySelectorAll('.node').forEach(g => { nodeEls[g.dataset.id] = g; });

// ------------------------------------------------------------------ visibility + highlight
function isVisible(n) {

}
function refresh() {

    hl = new Set(state.trace);

// ------------------------------------------------------------------ selection + panel
// Everything a reader needs before this node, basics first: "needs" is followed all the way

}

function evidenceItem(e) {

  else if (e.absent) body = `<div class="check">Checked: ${[].concat(e.absent).map(s => `“${esc(s)}”`).join(', ')} ${[].concat(e.absent).length > 1 ? 'do' : 'does'} not appear in this file.</div>`;

// ------------------------------------------------------------------ tour + search + events
function tourGo(i) {
  state.tour = Math.max(0, Math.min(META.tour.length - 1, i));
  if (state.view !== 'map') setView('map');
  select(META.tour[state.tour]);
}
function runSearch(q) {
  const box = $('#results');
  q = q.trim().toLowerCase();
  if (q.length < 2) { box.hidden = true; state.search = null; refresh(); return; }
  const score = n => {
    const t = n.title.toLowerCase(), l = labelOf(n).toLowerCase();
    if (n.id === q || l === q || (n.aliases || []).some(a => a.toLowerCase() === q)) return 0;
    if (t.startsWith(q) || l.startsWith(q)) return 1;
    if (t.includes(q) || l.includes(q)) return 2;
    if ((n.aliases || []).some(a => a.toLowerCase().includes(q))) return 3;
    if (n.summary.toLowerCase().includes(q) || (n.points || []).join(' ').toLowerCase().includes(q)) return 4;
    return 9;
  };
  const hits = NODES.map(n => [score(n), n]).filter(([s]) => s < 9).sort((a, b) => a[0] - b[0]).map(([, n]) => n);
  state.search = hits.map(n => n.id);
  box.innerHTML = hits.length ? hits.slice(0, 12).map(n => `<button data-ref="${esc(n.id)}" class="t-${n.type}"><span class="chip t-${n.type}" style="padding:0;border:0;background:none"><i></i></span>${esc(n.title)}<small>${esc(CLUSTER[n.cluster].label)}</small></button>`).join('') : '<div style="padding:8px;color:var(--muted);font-size:13px">No matches</div>';
  box.hidden = false;
  refresh();
}

function onRefClick(e) {
  const a = e.target.closest('[data-ref]');
  if (a) {
    e.preventDefault();
    $('#results').hidden = true;
    if (a.closest('#results')) { $('#search').value = ''; state.search = null; }
    select(a.dataset.ref, { pan: state.view === 'map' });
    return true;
  }
  return false;
}
function onAct(e) {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'tour-start') tourGo(0);
  if (act === 'tour-next') tourGo(state.tour + 1);
  if (act === 'tour-prev') tourGo(state.tour - 1);
  if (act === 'tour-end') { state.tour = null; renderPanel(); }
  if (act === 'home') select(null);
  if (act === 'issues') { $('#only-issues').checked = true; state.onlyIssues = true; if (state.view !== 'map') setView('map'); refresh(); fitTo(bounds); }
  if (act === 'copy') {
    const url = location.href.split('#')[0] + '#n=' + encodeURIComponent(state.sel);
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => { b.textContent = 'Link copied'; }, () => { b.textContent = url; });
  }
  if (act === 'trace') {
    const ids = [state.sel, ...prereqs(state.sel)];
    state.trace = ids;
    if (state.view !== 'map') setView('map');
    refresh();
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    ids.forEach(id => { const n = BY[id]; x0 = Math.min(x0, n.x - n._w / 2); x1 = Math.max(x1, n.x + n._w / 2); y0 = Math.min(y0, n.y - 20); y1 = Math.max(y1, n.y + 20); });
    const W = svg.clientWidth || 1, H = svg.clientHeight || 1, s = Math.min(W / (x1 - x0 + 80), H / (y1 - y0 + 80));
    animateTo({ x: (x0 + x1) / 2 - W / s / 2, y: (y0 + y1) / 2 - H / s / 2, w: W / s });
  }
}

function bindEvents() {
  // panel and other containers: links + actions
  ['#panel', '#view-timeline', '#view-changes', '#results'].forEach(sel => $(sel).addEventListener('click', e => { if (!onRefClick(e)) onAct(e); }));
  document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  $('#tour-btn').addEventListener('click', () => tourGo(state.tour === null ? 0 : state.tour));
  $('#only-issues').addEventListener('change', e => { state.onlyIssues = e.target.checked; refresh(); });
  $('#hide-old').addEventListener('change', e => { state.hideOld = e.target.checked; refresh(); });
  $('#type-chips').addEventListener('click', e => {
    const c = e.target.closest('.chip');
    if (!c) return;
    const t = c.dataset.type;
    if (state.hiddenTypes.has(t)) state.hiddenTypes.delete(t); else state.hiddenTypes.add(t);
    refresh();
  });
  const search = $('#search');
  search.addEventListener('input', () => runSearch(search.value));
  search.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const first = $('#results [data-ref]'); if (first) { select(first.dataset.ref); $('#results').hidden = true; } }
    if (e.key === 'Escape') { search.value = ''; runSearch(''); }
  });
  document.addEventListener('keydown', e => {
    if (e.target.matches('input, textarea')) return;
    if (e.key === 'Escape') { if (state.trace) { state.trace = null; refresh(); } else select(null); }
    if (state.tour !== null && e.key === 'ArrowRight') tourGo(state.tour + 1);
    if (state.tour !== null && e.key === 'ArrowLeft') tourGo(state.tour - 1);
    if (e.key === '/') { e.preventDefault(); search.focus(); }
  });
  $('#zoom-in').addEventListener('click', () => zoomAt(svg.clientWidth / 2, svg.clientHeight / 2, 1.4));
  $('#zoom-out').addEventListener('click', () => zoomAt(svg.clientWidth / 2, svg.clientHeight / 2, 1 / 1.4));
  $('#zoom-fit').addEventListener('click', () => fitTo(bounds));

  // map: pan, pinch, zoom, click, hover
  const tip = $('#tip'), pts = new Map();
  let pan = null, pinch = null, moved = false, downNode = null;
  svg.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    if (pts.size === 1) { moved = false; downNode = e.target.closest('.node'); pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; }
    if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), w: view.w }; moved = true; }
  });
  svg.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) {
      const g = e.target.closest('.node');
      if (g) {
        const n = BY[g.dataset.id], r = $('#view-map').getBoundingClientRect();
        tip.innerHTML = `<b>${esc(n.title)}</b><span>${esc(firstSentence(n.summary))}</span>`;
        tip.hidden = false;
        tip.style.left = Math.min(e.clientX - r.left + 14, r.width - 310) + 'px';
        tip.style.top = (e.clientY - r.top + 14) + 'px';
      } else tip.hidden = true;
      return;
    }
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    tip.hidden = true;
    if (pts.size === 1 && pan) {
      const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) { moved = true; svg.classList.add('dragging'); }
      if (moved) { const s = svg.clientWidth / view.w; view.x = pan.vx - dx / s; view.y = pan.vy - dy / s; applyView(); }
    } else if (pts.size === 2 && pinch) {
      const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = svg.getBoundingClientRect();
      zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, view.w / (pinch.w * pinch.d / d));
    }
  });
  const end = e => {
    pts.delete(e.pointerId);
    svg.classList.remove('dragging');
    if (pts.size === 0) {
      if (!moved && e.type === 'pointerup') { if (downNode) select(downNode.dataset.id, { pan: false }); else select(null); }
      pan = null; pinch = null;
    }
  };
  svg.addEventListener('pointerup', end);
  svg.addEventListener('pointercancel', end);
  svg.addEventListener('pointerleave', () => { tip.hidden = true; });
  svg.addEventListener('wheel', e => { e.preventDefault(); const r = svg.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); }, { passive: false });
  window.addEventListener('resize', () => { applyView(); drawTimelineLinks(); });
  window.addEventListener('hashchange', route);
}

function route() {
  const h = new URLSearchParams(location.hash.slice(1));
  const v = h.get('view');
  if (v && v !== state.view && ['map', 'timeline', 'changes'].includes(v)) setView(v);
  const id = h.get('n');
  if (id && BY[id] && id !== state.sel) select(id, { instant: !route.done });
  route.done = true;
}

// ------------------------------------------------------------------ start
try {
  $('#project-line').textContent = META.project;
  $('#type-chips').innerHTML = Object.entries(TYPES).filter(([k]) => NODES.some(n => n.type === k)).map(([k, v]) => `<button class="chip t-${k}" data-type="${k}" aria-pressed="true" title="Show or hide: ${esc(v[1])}"><i></i>${esc(v[0])}</button>`).join('');
  drawMap(layout());
  bindEvents();
  fitTo(bounds);
  refresh();
  renderPanel();
  route();
} catch (err) {
  document.body.insertAdjacentHTML('afterbegin', `<div class="err" id="kg-error">The page could not be drawn: ${esc(err.message)}. Check the JSON block with uv run python tools/check_graph.py.</div>`);
  throw err;
}
})();
</script>
</body>
</html>
